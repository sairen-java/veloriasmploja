<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento cancelado — Veloria SMP</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .status-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse 60% 50% at 50% 0%, #14233b 0%, var(--bg) 70%);
        padding: 24px;
      }
      .status-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .status-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }
      .status-card p {
        color: var(--text-soft);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="status-page">
      <div class="status-card">
        <div class="status-icon">🙈</div>
        <h1>Pagamento cancelado</h1>
        <p>Não te preocupes, não foi feita nenhuma cobrança. O teu carrinho continua guardado.</p>
        <a class="btn btn-primary" href="/" style="margin-top: 16px; display: inline-flex">Voltar à loja</a>
      </div>
    </div>
  </body>
</html>
