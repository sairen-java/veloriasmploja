<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra confirmada — Veloria SMP</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .status-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse 60% 50% at 50% 0%, #14233b 0%, var(--bg) 70%);
        padding: 24px;
      }
      .status-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 40px;
        max-width: 460px;
        width: 100%;
        text-align: center;
      }
      .status-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }
      .status-card h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      .status-card p {
        color: var(--text-soft);
        font-weight: 500;
      }
      .order-box {
        text-align: left;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 18px;
        margin: 20px 0;
      }
      .order-box .row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 700;
        padding: 4px 0;
      }
      .order-box .total {
        border-top: 1px dashed var(--border-strong);
        margin-top: 8px;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="status-page">
      <div class="status-card" id="content">
        <div class="status-icon">⏳</div>
        <h1>A confirmar o teu pagamento...</h1>
        <p>Aguarda só um momento.</p>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");
      const content = document.getElementById("content");

      function formatPrice(cents) {
        return (cents / 100).toLocaleString("pt-PT", {
          style: "currency",
          currency: "EUR",
        });
      }

      async function check() {
        if (!sessionId) {
          content.innerHTML = `
            <div class="status-icon">🤔</div>
            <h1>Sessão não encontrada</h1>
            <p>Volta à loja e tenta novamente.</p>
            <a class="btn btn-primary" href="/" style="margin-top:16px;display:inline-flex">Voltar à loja</a>
          `;
          return;
        }

        try {
          const res = await fetch(`/api/checkout/session/${sessionId}`);
          const data = await res.json();

          if (!res.ok || !data.paid) {
            content.innerHTML = `
              <div class="status-icon">😕</div>
              <h1>Pagamento não confirmado</h1>
              <p>Se acabaste de pagar, aguarda uns segundos e atualiza a página.</p>
              <a class="btn btn-secondary" href="/" style="margin-top:16px;display:inline-flex">Voltar à loja</a>
            `;
            return;
          }

          const itemsHtml = (data.items || [])
            .map(
              (item) => `
              <div class="row"><span>${item.quantity}x ${item.name}</span><span>${formatPrice(
                item.unitPrice * item.quantity
              )}</span></div>
            `
            )
            .join("");

          content.innerHTML = `
            <div class="status-icon">🎉</div>
            <h1>Compra confirmada!</h1>
            <p>Obrigado pela tua compra no Veloria SMP.</p>
            <div class="order-box">
              ${itemsHtml}
              <div class="row total"><span>Total</span><span>${formatPrice(data.amountTotal)}</span></div>
              ${
                data.minecraftUsername
                  ? `<div class="row"><span>Nick</span><span>${data.minecraftUsername}</span></div>`
                  : ""
              }
            </div>
            <p>A tua encomenda vai ser entregue automaticamente no servidor. Se demorar, contacta-nos no Discord.</p>
            <a class="btn btn-primary" href="/" style="margin-top:10px;display:inline-flex">Voltar à loja</a>
          `;
        } catch (err) {
          content.innerHTML = `
            <div class="status-icon">⚠️</div>
            <h1>Ocorreu um erro</h1>
            <p>Não conseguimos confirmar o pagamento agora. Contacta o suporte se o dinheiro já foi debitado.</p>
          `;
        }
      }

      check();
    </script>
  </body>
</html>
